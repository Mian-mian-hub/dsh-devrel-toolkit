# A patch overlay, not a profile config. Pass it explicitly:
#   npm run dev
# or: dsh --profile web --patch ./cordis.yml
# `insert` adds a row to the profile's plugin tree; the relative path is
# resolved against this file's directory.
- insert:
    - id: dsh-devrel-toolkit
      name: './src/index.ts'
      config:
        repositories: !!js (process.env.DEVREL_GITHUB_REPOSITORIES ?? '').split(',').map(s => s.trim()).filter(Boolean)
    - id: devrel-board-ui
      name: './ui/index.js'
