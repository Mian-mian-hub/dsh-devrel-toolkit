# Dedicated signed ingress. The dashboard is supplied by the toolkit bundle.
- insert:
    - id: devrel-github-ingress
      name: cordis:group
      group: true
      isolate:
        webServer: true
        webhookRuntime: true
      config:
        - id: devrel-github-server
          name: '@deepseek-ai/dsh-host-webserver'
          config:
            host: '127.0.0.1'
            port: !!js Number(process.env.DEVREL_WEBHOOK_PORT ?? 3081)
        - id: devrel-github-board-bridge
          name: '../../dist/github-issues.js'
          config:
            source: devrel-github
            maxBodyChars: 6000
        - id: devrel-github-adapter
          name: '@deepseek-ai/dsh-webhook-github'
          config:
            source: devrel-github
            path: /github
            secretEnv: DSH_GITHUB_WEBHOOK_SECRET
            maxBodyBytes: 1048576
